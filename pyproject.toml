# Tooling configuration only: GestureSense is run from source or built with build_exe.bat.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741"]            # short names like `l` are fine in maths-heavy drawing code

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
